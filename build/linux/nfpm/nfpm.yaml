# Linux 打包元数据（deb / rpm / Arch），由 wails3 内置的 nfpm 读取
# 文档：https://nfpm.goreleaser.com
#
# 注意：这里曾整份是 wails 模板的默认值（name 写成 wbprobe.exe、license MIT 等），
# 会导致 `wails3 task linux:create:deb` 报
#   matching "./bin/wbprobe.exe": file does not exist

# 包名保持小写：「Debian 策略」要求包名只能由 a-z0-9+-. 组成，
# 所以它和 APP_NAME（KinhDesktop）不同 —— 这只是元数据，产物二进制名不受影响
name: "kinh-desktop"
arch: ${GOARCH}
platform: "linux"
# 版本号由 build/ci/set-version.sh 从 Git tag 同步
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: "OshinTeam <mogumc@outlook.com>"
description: "KinhWeb 桌面客户端"
vendor: "OshinTeam"
homepage: "https://github.com/OshinTeam/KinhDesktop"
license: "GPL-2.0"
release: "1"

contents:
  - src: "./bin/KinhDesktop"
    dst: "/usr/local/bin/KinhDesktop"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/KinhDesktop.png"
  - src: "./build/linux/KinhDesktop.desktop"
    dst: "/usr/share/applications/KinhDesktop.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
