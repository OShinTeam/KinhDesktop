plugins {
    id 'com.android.application'
}

// CI 注入的版本号（由 build/ci/set-version.sh 从 Git tag 推导后写入环境变量）。
// 本机构建没有这两个变量，取到 null，回落到 defaultConfig 里的默认值。
def ciVersionName = System.getenv("APP_VERSION")?.trim()
def ciVersionCode = System.getenv("APP_VERSION_CODE")?.trim()

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.oshinteam.kinhdesktop"
        // minSdk 23（M / Android 6.0）。wails 的 Java 层按 API 23+ 编写：
        // checkSelfPermission / requestPermissions 是 API 23 引入的，
        // registerDefaultNetworkCallback 是 API 24 —— 留在 21 会让
        // `gradlew lintRelease` 报 8 处 NewApi 错误并中断 CI。
        // 代码里的版本分支最低就是 SDK_INT >= M(=23)，抬到 23 不影响任何逻辑。
        minSdk 23
        targetSdk 35
        // versionCode 必须随每次发布递增，否则 Android 会拒绝覆盖安装与上架，
        // 因此由 CI 从语义化版本推导：major*10000 + minor*100 + patch（0.2.0 → 200）
        versionCode (ciVersionCode?.isInteger() ? ciVersionCode.toInteger() : 1)
        versionName (ciVersionName ?: "1.0")

        // Configure supported ABIs
        //
        // 只保留 arm64-v8a：目前仅 arm64 产物经过真机验证。
        // 模拟器请开启「ARM 兼容模式」运行，不要依赖 x86_64 构建。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
    }

    // abortOnError false：WailsBridge.java 有一处 MissingPermission 误报
    // （:956 的 requestSingleUpdate 实际被 :963 的 `catch (Exception e)` 覆盖，
    //  静态分析看不出 Exception 兜得住 SecurityException）。
    // 该文件属 wails 框架、不宜改，而正规做法 lint baseline 需在 JDK 17/21 下
    // 由 updateLintBaseline 生成（本机 25 跑不出来），故暂不中断构建。
    // 报告仍会生成到 app/build/reports/lint-results-release.html。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
