plugins {
    id 'com.android.application'
}

// CI 注入的版本号（由 build/ci/set-version.sh 从 Git tag 推导后写入环境变量）。
// 本机构建没有这两个变量，取到 null，回落到 defaultConfig 里的默认值。
def ciVersionName = System.getenv("APP_VERSION")?.trim()
def ciVersionCode = System.getenv("APP_VERSION_CODE")?.trim()

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.oshinteam.kinhdesktop"
        minSdk 21
        targetSdk 35
        // versionCode 必须随每次发布递增，否则 Android 会拒绝覆盖安装与上架，
        // 因此由 CI 从语义化版本推导：major*10000 + minor*100 + patch（0.2.0 → 200）
        versionCode (ciVersionCode?.isInteger() ? ciVersionCode.toInteger() : 1)
        versionName (ciVersionName ?: "1.0")

        // Configure supported ABIs
        //
        // 只保留 arm64-v8a。
        // 原因：OShinD 组件的 x86_64 版本在实际运行中不稳定 —— 表现为主界面
        // 登录成功后加载组件（dlopen + 首次 FFI 调用）时崩溃；OShinD 目前
        // 只有 arm64 产物是可靠的。
        // 模拟器请开启「ARM 兼容模式」运行，不要依赖 x86_64 构建。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
        // OShinD 组件同样是 c-shared 产物，strip 会破坏其导出符号
        doNotStrip '*/arm64-v8a/liboshind.so'
        doNotStrip '*/x86_64/liboshind.so'
    }

    // AGP 8.7.3 的 lint 在 JDK 25 下会崩溃（官方支持到 JDK 17/21），
    // 而 release 构建默认执行 lintVital 检查，其崩溃会中断整个打包流程。
    // 这里关闭 release 构建的 lint；需要静态检查时请用 JDK 17/21 单独执行 ./gradlew lint
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
